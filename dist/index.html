<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yunda's Optimizer</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0a0b0e;
      color: #e7e9ee;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 40px;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(80,96,140,0.14), transparent 70%),
        #0a0b0e;
    }
    .mark {
      font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
      color: #6b7280; margin-bottom: 28px; font-weight: 600;
    }
    .card {
      max-width: 460px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.025);
      border-radius: 16px;
      padding: 40px 38px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    h1 {
      font-size: 22px; font-weight: 650; color: #f3f4f7;
      margin-bottom: 14px; line-height: 1.3;
    }
    p {
      font-size: 15px; line-height: 1.65; color: #9aa1ad;
    }
    .foot {
      margin-top: 30px; font-size: 12px; color: #4b515c; letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Yunda&rsquo;s Optimizer</div>
    <div class="card">
      <h1>Thank you for using the optimizer.</h1>
      <p>Unfortunately it is no longer available.</p>
    </div>
    <div class="foot">All optimizer changes have been reverted to Windows defaults.</div>
  </div>
</body>
</html>
